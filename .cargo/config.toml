# Toolchain-free cross-compilation to Linux x86_64.
#
# rzstd has no C dependencies (zstd decoding is pure Rust via `ruzstd`),
# so a fully static Linux binary can be produced from any host with:
#
#   rustup target add x86_64-unknown-linux-musl
#   cargo build --release --target x86_64-unknown-linux-musl
#
# The musl target's libc/crt objects are bundled in Rust's prebuilt std,
# and we link with Rust's own bundled `rust-lld` — no gcc/clang, no Docker.
#
# `rust-lld` lives inside the active toolchain; expose it on PATH once with:
#   ln -sf "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/rust-lld" ~/.cargo/bin/rust-lld
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "link-self-contained=yes",
    "-C", "target-feature=+crt-static",
]

[package]
name = "rzstd"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = {version = "1.35.1", features = ["full"]}
# Pure-Rust zstd decoder: no C toolchain needed, so the binary
# cross-compiles to Linux from any host with just `cargo build`.
ruzstd = "0.7"
grep-matcher = "0.1.7"
grep-regex = "0.1.12"
grep-searcher = "0.1.13"
anyhow = "1.0.76"
clap = { version = "4", features = ["derive"] }
futures = "0.3.29"
colored = "2.0"
